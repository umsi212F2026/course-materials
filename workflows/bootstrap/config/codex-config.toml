# SI 212 - Codex settings.
#
# Installed to ~/.codex/config.toml during first-day bootstrap. Points the app at U-M's
# gateway instead of the vendor's, which is what makes the U-M Toolkit key work.
#
# ASCII only, deliberately. Windows PowerShell does not read this file as UTF-8, so any
# accented character or dash shows up as garbled text at the exact step where a student is
# being asked to check the output carefully.
#
# `model` and `model_reasoning_effort` are STARTING defaults, not course requirements. They are
# set here only so all 48 students begin in the same known place rather than on whatever the
# app defaults to that week. Students change both from beside the message box, and choosing a
# model against a token budget is part of the course.
#
# They start cheap on purpose. Raising it is a decision a student makes when a task needs it,
# which is a better lesson than starting high and never noticing. First-day setup measured at
# about twelve cents on these settings, against about a dollar sixteen for the same work on a
# heavier model - both on 2026-08-26, both reaching the same place.
#
# The effort is pinned here rather than left to the app because it is roughly half of what
# determines a bill and nothing records it: the setup check reports the model and no log
# anywhere names the effort, so a run without this line cannot be compared with another one.
#
# `name` is what shows at the bottom left of the app window, so it doubles as the visible
# proof that this file is installed and working.

model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
model_provider = "toolkit"

[model_providers.toolkit]
name = "UM GPT Toolkit"
base_url = "https://api.toolkit.umgpt.umich.edu/v1"
requires_openai_auth = true
