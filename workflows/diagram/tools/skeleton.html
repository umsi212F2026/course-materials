<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Diagram Viewer</title>

    <!-- bpmn-js is injected by render.mjs via loadScript() -->

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     Helvetica, Arial, sans-serif;
      }

      html, body, #canvas {
        height: 100%;
        padding: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="canvas"></div>

    <script>
      let bpmnViewer;

      function getViewer() {
        if (bpmnViewer) return bpmnViewer;

        bpmnViewer = new BpmnJS({ container: '#canvas' });

        bpmnViewer.on('import.done', function (event) {
          if (event.error) return console.error('could not import BPMN 2.0 diagram', event.error);
          bpmnViewer.get('canvas').zoom('fit-viewport');
        });

        return bpmnViewer;
      }

      async function openDiagram(bpmnXML) {
        const viewer = getViewer();

        await viewer.importXML(bpmnXML);

        const viewbox = viewer.get('canvas').viewbox();

        return {
          width: viewbox.inner.width,
          height: viewbox.inner.height,
        };
      }

      async function resize() {
        const canvas = getViewer().get('canvas');
        canvas.resized();
        canvas.zoom('fit-viewport');
      }

      function loadScript(src) {
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.charset = 'utf8';
        script.src = src;

        const promise = new Promise((resolve, reject) => {
          script.onload = () => resolve();
          script.onerror = (err) => reject(err);
        });

        document.head.appendChild(script);
        return promise;
      }
    </script>
  </body>
</html>
